  <!-- Aplica o tema salvo antes da primeira pintura (evita "piscar" claro/escuro). -->
  <script>
    (function () {
      var theme = 'light';
      try {
        var saved = JSON.parse(localStorage.getItem('fluxo:state') || '{}');
        theme = (saved.settings && saved.settings.theme) || 'system';
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
      } catch (error) {
        theme = 'light';
      }
      // Define o tema, o esquema de cores (barras de rolagem/controles nativos) e a cor
      // da barra do navegador no celular já na primeira pintura.
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      var meta = document.getElementById('theme-color-meta');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#0e1117' : '#f4f5f8');
    })();
  </script>
</head>
